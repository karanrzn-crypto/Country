<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Country — Strategic Foundation</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #0b0e14; color: #d7dde8;
        font-family: ui-monospace, 'JetBrains Mono', Consolas, Menlo, monospace;
        font-size: 13px; line-height: 1.45;
      }
      #app { width: 100%; height: 100%; position: relative; }
      #app canvas { display: block; }

      .ui-root { position: absolute; inset: 0; pointer-events: none; }
      .ui-root > * { pointer-events: auto; }

      .hud {
        position: absolute; left: 12px; bottom: 12px;
        display: flex; flex-direction: column; gap: 2px;
        background: rgba(13, 18, 28, 0.85);
        border: 1px solid #2a3446; border-radius: 6px;
        padding: 8px 12px; min-width: 260px;
      }
      .hud .hud-title { color: #7fb2ff; font-weight: 700; letter-spacing: 1px; }
      .hud .hud-row { display: flex; justify-content: space-between; gap: 16px; }
      .hud .hud-key { color: #8a94a6; }
      .hud .hud-value { color: #e8edf5; }

      /* —— time bar (top-center): date + play/pause + speed steps —— */
      .time-bar {
        position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
        display: flex; align-items: center; gap: 5px;
        background: rgba(13, 18, 28, 0.88);
        border: 1px solid #2a3446; border-radius: 6px;
        padding: 6px 10px;
      }
      .time-date {
        color: #e8edf5; font-weight: 700; letter-spacing: 1px; margin-right: 6px;
        font-variant-numeric: tabular-nums; font-size: 13px;
      }
      .time-btn {
        font: inherit; font-size: 11px; cursor: pointer;
        border: 1px solid #33415c; border-radius: 3px;
        padding: 3px 9px; color: #cfd8e6; background: #1a2333;
      }
      .time-btn:hover { background: #243149; border-color: #4a5f88; }
      .time-btn.on { border-color: #4a7f4a; color: #b8e6b8; background: #1d2b1d; font-weight: 700; }
      .time-btn.pause.stopped { border-color: #8a6d2f; color: #ffd27f; background: #2b2312; font-weight: 700; }

      /* —— biome legend (right edge, visible only while the layer is on) —— */
      .map-legend {
        position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
        background: rgba(13, 18, 28, 0.88);
        border: 1px solid #2a3446; border-radius: 6px;
        padding: 8px 12px; min-width: 132px;
        display: flex; flex-direction: column; gap: 4px;
      }
      .map-legend-title { color: #8a94a6; font-size: 11px; letter-spacing: 2px; font-weight: 700; }
      .map-legend-title:not(:first-child) { margin-top: 8px; padding-top: 8px; border-top: 1px solid #2a3446; }
      .map-legend-row { display: flex; align-items: center; gap: 8px; }
      .map-legend-swatch {
        width: 14px; height: 14px; border-radius: 3px; flex: 0 0 auto;
        border: 1px solid rgba(255, 255, 255, 0.28);
      }
      .map-legend-label { color: #cfd8e6; font-size: 12px; }

      .debug-overlay {
        position: absolute; top: 12px; left: 12px;
        background: rgba(10, 14, 20, 0.88);
        border: 1px solid #2a3446; border-radius: 6px;
        padding: 8px 12px; white-space: pre;
        color: #9fe6a0; font-size: 12px;
      }

      .notifications {
        position: absolute; top: 12px; right: 12px;
        display: flex; flex-direction: column; gap: 6px; width: 300px;
      }
      .notification {
        background: rgba(13, 18, 28, 0.92);
        border: 1px solid #2a3446; border-left: 3px solid #7fb2ff;
        border-radius: 4px; padding: 6px 10px;
      }
      .notification.warn { border-left-color: #ffb454; }
      .notification.error { border-left-color: #ff6b6b; }
      .notification .nt-title { font-weight: 700; }
      .notification .nt-message { color: #aeb8c8; }

      .screen-layer {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: rgba(5, 8, 12, 0.72);
      }
      .screen {
        background: #10151f;
        border: 1px solid #2a3446; border-radius: 10px;
        padding: 28px 36px; min-width: 320px;
        display: flex; flex-direction: column; gap: 10px;
      }
      .screen h1 { font-size: 22px; letter-spacing: 4px; color: #7fb2ff; }
      .screen h2 { font-size: 16px; color: #c7d2e0; }
      .screen .screen-subtitle { color: #8a94a6; margin-bottom: 10px; }
      .screen button {
        font: inherit; color: #e8edf5; background: #1a2333;
        border: 1px solid #33415c; border-radius: 5px;
        padding: 8px 14px; cursor: pointer; text-align: left;
      }
      .screen button:hover { background: #243149; border-color: #4a5f88; }
      .screen .map-country-list { display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow: auto; }
      .screen .dialog-actions { display: flex; gap: 8px; margin-top: 8px; }

      .map-info-panel {
        position: absolute; top: 12px; left: 12px;
        background: rgba(13, 18, 28, 0.88);
        border: 1px solid #2a3446; border-radius: 6px;
        padding: 10px 14px; min-width: 280px;
        max-height: calc(100% - 24px); overflow: auto;
      }
      .map-info-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
      .map-info-flag { width: 30px; height: 20px; border: 1px solid #2a3446; border-radius: 2px; display: block; flex: 0 0 auto; }
      .map-country-detail { display: flex; flex-direction: column; gap: 2px; }
      .map-country-basic { display: flex; flex-direction: column; gap: 2px; }
      .map-country-name { color: #e8edf5; font-weight: 700; margin-bottom: 2px; }
      .map-section-title { color: #8a94a6; margin-top: 7px; font-size: 11px; letter-spacing: 1px; }
      .map-resource-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
      .map-resource-chip { border: 1px solid #33415c; border-radius: 3px; padding: 1px 5px; font-size: 10px; color: #cfd8e6; }
      .map-resource-chip.empty { opacity: 0.5; }
      .map-relations { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; }
      .map-relation-row { display: flex; justify-content: space-between; gap: 10px; }
      .map-relation-name { color: #cfd8e6; }
      .map-relation-band.band-hostile { color: #ff6b6b; }
      .map-relation-band.band-wary { color: #ffb454; }
      .map-relation-band.band-neutral { color: #aeb8c8; }
      .map-relation-band.band-cordial { color: #9fe6a0; }
      .map-relation-band.band-friendly { color: #52d273; }
      .map-relation-empty { color: #6b7688; font-size: 11px; }
      .map-country-row { display: flex; align-items: center; gap: 8px; }
      .map-row-flag { width: 24px; height: 16px; border: 1px solid #2a3446; border-radius: 2px; display: block; flex: 0 0 auto; }
      .map-info-title { color: #7fb2ff; font-weight: 700; letter-spacing: 1px; margin-bottom: 6px; }
      .map-info-row { display: flex; justify-content: space-between; gap: 16px; }
      .map-info-key { color: #8a94a6; }
      .map-info-value { color: #e8edf5; font-weight: 600; }
      .map-layers-title { color: #8a94a6; margin-top: 8px; font-size: 11px; letter-spacing: 1px; }
      .map-layers { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; max-width: 300px; }
      .map-layer-toggle {
        font: inherit; font-size: 10px; cursor: pointer;
        border: 1px solid #33415c; border-radius: 3px;
        padding: 2px 6px; color: #e8edf5; background: #1a2333;
      }
      .map-layer-toggle.on { border-color: #4a7f4a; color: #b8e6b8; background: #1d2b1d; }
      .map-layer-toggle.off { opacity: 0.45; text-decoration: line-through; }
      .map-country-list button { font: inherit; }
      /* —— country-select screen (Part 3) —— */
      .screen-actions { display: flex; gap: 8px; margin-top: 14px; justify-content: center; }
      .screen-confirm {
        font: inherit; font-size: 14px; cursor: pointer;
        border: 1px solid #4a7f4a; border-radius: 4px;
        padding: 6px 18px; color: #b8e6b8; background: #1d2b1d; font-weight: 700;
      }
      .screen-confirm.disabled { opacity: 0.4; cursor: not-allowed; }
      .screen-cancel {
        font: inherit; font-size: 14px; cursor: pointer;
        border: 1px solid #33415c; border-radius: 4px;
        padding: 6px 14px; color: #cfd8e6; background: #1a2333;
      }
      .map-country-list { max-height: 46vh; overflow-y: auto; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
