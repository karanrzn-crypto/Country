<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Country — Strategic Foundation</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #0b0e14; color: #d7dde8;
        font-family: ui-monospace, 'JetBrains Mono', Consolas, Menlo, monospace;
        font-size: 13px; line-height: 1.45;
      }
      #app { width: 100%; height: 100%; position: relative; }
      #app canvas { display: block; }

      .ui-root { position: absolute; inset: 0; pointer-events: none; }
      .ui-root > * { pointer-events: auto; }

      .hud {
        position: absolute; left: 12px; bottom: 12px;
        display: flex; flex-direction: column; gap: 2px;
        background: rgba(13, 18, 28, 0.85);
        border: 1px solid #2a3446; border-radius: 6px;
        padding: 8px 12px; min-width: 260px;
      }
      .hud .hud-title { color: #7fb2ff; font-weight: 700; letter-spacing: 1px; }
      .hud .hud-row { display: flex; justify-content: space-between; gap: 16px; }
      .hud .hud-key { color: #8a94a6; }
      .hud .hud-value { color: #e8edf5; }

      .debug-overlay {
        position: absolute; top: 12px; left: 12px;
        background: rgba(10, 14, 20, 0.88);
        border: 1px solid #2a3446; border-radius: 6px;
        padding: 8px 12px; white-space: pre;
        color: #9fe6a0; font-size: 12px;
      }

      .notifications {
        position: absolute; top: 12px; right: 12px;
        display: flex; flex-direction: column; gap: 6px; width: 300px;
      }
      .notification {
        background: rgba(13, 18, 28, 0.92);
        border: 1px solid #2a3446; border-left: 3px solid #7fb2ff;
        border-radius: 4px; padding: 6px 10px;
      }
      .notification.warn { border-left-color: #ffb454; }
      .notification.error { border-left-color: #ff6b6b; }
      .notification .nt-title { font-weight: 700; }
      .notification .nt-message { color: #aeb8c8; }

      .screen-layer {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: rgba(5, 8, 12, 0.72);
      }
      .screen {
        background: #10151f;
        border: 1px solid #2a3446; border-radius: 10px;
        padding: 28px 36px; min-width: 320px;
        display: flex; flex-direction: column; gap: 10px;
      }
      .screen h1 { font-size: 22px; letter-spacing: 4px; color: #7fb2ff; }
      .screen h2 { font-size: 16px; color: #c7d2e0; }
      .screen .screen-subtitle { color: #8a94a6; margin-bottom: 10px; }
      .screen button {
        font: inherit; color: #e8edf5; background: #1a2333;
        border: 1px solid #33415c; border-radius: 5px;
        padding: 8px 14px; cursor: pointer; text-align: left;
      }
      .screen button:hover { background: #243149; border-color: #4a5f88; }
      .screen .map-region-list { display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow: auto; }
      .screen .dialog-actions { display: flex; gap: 8px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
